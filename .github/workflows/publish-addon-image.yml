name: Publish Playlist Assistant app image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  prepare:
    name: Prepare app image build
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ env.ARCHITECTURES }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.image.outputs.image_name }}
      registry_prefix: ${{ steps.image.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Read app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./ha_app
      - name: Verify release version
        env:
          APP_VERSION: ${{ steps.info.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${APP_VERSION}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} must exactly match ha_app/config.yaml version ${APP_VERSION}."
            exit 1
          fi
      - name: Split image reference
        id: image
        env:
          IMAGE: ${{ steps.info.outputs.image }}
        run: |
          echo "image_name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${IMAGE%/*}" >> "$GITHUB_OUTPUT"
      - name: Prepare multi-architecture build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ steps.image.outputs.image_name }}
          registry-prefix: ${{ steps.image.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./ha_app
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=Playlist Assistant
            io.hass.description=Playlist Assistant brings music you already like back into rotation by building private Spotify playlists from your selected sources and listening history.
            io.hass.url=https://github.com/RolandFran/playlist-assistant
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish generic multi-architecture manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
