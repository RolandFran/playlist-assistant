<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <base href="{{INGRESS_BASE_PATH}}">
  <title>Playlist Assistant</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="polish.css">
</head>
<body>
  <main>
    <h1 data-i18n="title"></h1>
    <p id="message" role="alert"></p>
    <p id="status"></p>
    <div class="dashboard-grid">
      <section class="playlist-preview">
        <h2 data-i18n="playlist_preview"></h2>
        <div class="playlist-toolbar">
          <input id="filter">
          <button id="reset-sorting" type="button" data-i18n="reset_sorting"></button>
        </div>
        <table>
          <thead>
            <tr>
              <th data-i18n="track_title" data-sort="track_name"></th>
              <th data-i18n="artist" data-sort="artist_name"></th>
              <th data-i18n="score" data-sort="combined_score"></th>
              <th data-i18n="plays" data-sort="play_count"></th>
              <th data-i18n="last_played" data-sort="last_played"></th>
            </tr>
          </thead>
          <tbody id="tracks"></tbody>
        </table>
      </section>
      <aside class="dashboard-sidebar">
        <section>
          <h2 data-i18n="settings"></h2>
          <form id="settings"></form>
        </section>
        <section>
          <h2 data-i18n="spotify_authorization"></h2>
          <div id="spotify-auth"></div>
        </section>
        <section>
          <h2 data-i18n="actions"></h2>
          <div id="actions"></div>
        </section>
        <section>
          <h2 data-i18n="info"></h2>
          <p data-i18n="info_description"></p>
        </section>
      </aside>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
