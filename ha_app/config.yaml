name: Playlist Assistant
slug: playlist_assistant
version: "0.1.8"
description: Creates a private Today playlist from #today-source Spotify playlists, prioritizing least-played and least-recently-played tracks.
url: https://github.com/RolandFran/playlist-assistant
startup: application
init: false
ingress: true
ingress_port: 8098
homeassistant_api: true
arch:
  - aarch64
  - amd64
watchdog: http://[HOST]:8099/health
options:
  spotify_client_id: ""
  spotify_client_secret: ""
  bridge_token: ""
schema:
  spotify_client_id: str
  spotify_client_secret: password
  bridge_token: password
