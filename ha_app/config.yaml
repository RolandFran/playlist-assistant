name: Playlist Assistant
slug: playlist_assistant
version: "0.1.38"
image: "ghcr.io/rolandfran/playlist-assistant"
description: Playlist Assistant brings music you already like back into rotation by building private Spotify playlists from your selected sources and listening history.
url: https://github.com/RolandFran/playlist-assistant
startup: application
init: false
ingress: true
ingress_port: 8098
panel_icon: mdi:play
homeassistant_api: true
arch:
  - aarch64
  - amd64
watchdog: http://[HOST]:8099/health
options: {}
schema:
  # Temporary compatibility only: permits options left by add-on versions before
  # 0.1.11. They are ignored and must not be used for Spotify authentication.
  spotify_client_id: "str?"
  spotify_client_secret: "password?"
  bridge_token: "password?"
