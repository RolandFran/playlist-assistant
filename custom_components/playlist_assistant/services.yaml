sync:
  name: Sync
  description: Synchronize listening history and source playlists.

preview:
  name: Preview
  description: Generate a preview of the next Today playlist without publishing it.

publish:
  name: Publish
  description: Publish the current Today playlist.

run:
  name: Run
  description: Run the complete scheduled Playlist Assistant workflow.

reconfigure_schedule:
  name: Reconfigure schedule
  description: Internal service used by the Playlist Assistant add-on to apply saved scheduling changes.

diagnose_playlist_details:
  name: Diagnose playlist details
  description: Temporary diagnostic only. Compares direct Home Assistant OAuth with Playlist Assistant SpotifyApi for a playlist-details PUT; it is not a production fix.
  fields:
    playlist_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    public:
      required: true
      selector:
        boolean:
    variant:
      required: true
      selector:
        select:
          options:
            - direct_oauth
            - spotify_api
