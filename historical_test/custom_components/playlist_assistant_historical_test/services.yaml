sync:
  name: Sync
  description: Synchronize listening history and source playlists.

preview:
  name: Preview
  description: Generate a preview of the next Today playlist without publishing it.

publish:
  name: Publish
  description: Publish the current Today playlist.

run:
  name: Run
  description: Run the complete scheduled Playlist Assistant Historical Test workflow.

reconfigure_schedule:
  name: Reconfigure schedule
  description: Internal service used by the Playlist Assistant Historical Test add-on to apply saved scheduling changes.
